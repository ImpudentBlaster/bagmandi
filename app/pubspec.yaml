name: bagmandi
description: BagMandi - India's Bag Industry Marketplace
publish_to: 'none'
version: 1.1.1+14

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  geolocator: ^14.0.0
  geocoding: ^4.0.0
  image_picker: ^1.1.2
  provider: ^6.1.2
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  pin_code_fields: ^8.0.1
  uuid: ^4.5.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
